name: Release
on:
    workflow_dispatch:
    workflow_call:
        inputs:
            cliff_config:
                description: Path to git-cliff config
                type: string
                required: false
                default: ""
            cliff_release_config:
                description: Path to git-cliff config; used for generated release notes
                type: string
                required: false
                default: ""
            changelog_output_path:
                description: Where the changelog will be saved
                type: string
                required: false
                default: "CHANGELOG.md"
        outputs:
            version:
                description: The release tag that was created
                value: ${{ jobs.release.outputs.version }}

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.cliff.outputs.version }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git-cliff
              uses: taiki-e/install-action@v2
              with:
                  tool: git-cliff

            - name: Fetch default configs
              run: |
                if [ -z "${{ inputs.cliff_config }}" ] || [ ! -f "${{ inputs.cliff_config }}" ]; then
                    curl -sL https://raw.githubusercontent.com/mcl-playz/actions/main/.github/cliff.toml -o /tmp/cliff.toml
                fi
                if [ -z "${{ inputs.cliff_release_config }}" ] || [ ! -f "${{ inputs.cliff_release_config }}" ]; then
                    curl -sL https://raw.githubusercontent.com/mcl-playz/actions/main/.github/cliff-release.toml -o /tmp/cliff-release.toml
                fi

            - name: Bump version and generate changelog
              id: cliff
              run: |
                CLIFF_CONFIG="${{ inputs.cliff_config }}"
                if [ -z "$CLIFF_CONFIG" ] || [ ! -f "$CLIFF_CONFIG" ]; then
                    CLIFF_CONFIG="/tmp/cliff.toml"
                fi
                RELEASE_CONFIG="${{ inputs.cliff_release_config }}"
                if [ -z "$RELEASE_CONFIG" ] || [ ! -f "$RELEASE_CONFIG" ]; then
                    RELEASE_CONFIG="/tmp/cliff-release.toml"
                fi

                NEXT_VERSION=$(git cliff --bumped-version -c "$CLIFF_CONFIG")
                echo "version=v$NEXT_VERSION" >> $GITHUB_OUTPUT
                git cliff --bump --unreleased --strip all -c "$RELEASE_CONFIG" -o RELEASE_NOTES.md
                git cliff --bump -c "$CLIFF_CONFIG" -o "${{ inputs.changelog_output_path }}"
                    - name: Commit changelog
                    run: |
                        git config user.name "github-actions[bot]"
                        git config user.email "github-actions[bot]@users.noreply.github.com"
                        git add ${{ inputs.changelog_output_path }}
                        git commit -m "chore(release): prepare for ${{ steps.cliff.outputs.version }}"
                        git tag ${{ steps.cliff.outputs.version }}
                        git push
                        git push --tags
                        
            - name: Create GitHub release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                gh release create ${{ steps.cliff.outputs.version }} \
                    --title "${{ steps.cliff.outputs.version }}" \
                    --notes-file RELEASE_NOTES.md
